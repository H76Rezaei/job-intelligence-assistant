# Example search settings with made-up values.
# Copy this file to config/search.toml (ignored by git) and put your own search there.
# Another path can be set with the SEARCH_SETTINGS_PATH environment variable.

# A keyword with several words finds postings containing all of them in any order:
# "AI Developer" also finds "Junior AI Developer" and "Generative AI Developer".
# Add German and English variants: "AI Developer" does not find "KI-Entwickler".
keywords = ["Python", "Backend"]

# Also search for fully remote jobs anywhere in Germany
remote_germany = true

# A job whose title contains one of these words (whole word, any case) is never stored.
# Titles that also say Junior, Mid, Entry, Einsteiger or Berufseinsteiger are kept.
# Only the title counts, never the description. Leave out to use this default list.
exclude_title_words = ["Senior", "Sr.", "Lead", "Principal", "Staff", "Head of", "Leiter", "Teamleiter"]

# A job not seen for this many days counts as reopened
reopen_after_days = 60

# Upper limit of requests to a source in one run. Until a source has completed a
# run (the first run looks back 7 days), it gets the larger first-run limit.
max_requests_first_run = 500
max_requests_per_run = 300

# Search around each center within its radius
[[centers]]
name = "Köln"
radius_km = 30

[[centers]]
name = "Leipzig"
radius_km = 25

# LinkedIn has its own, lower cap (also on the first run) and pauses between requests,
# because it answers fast requests with "too many requests". Leave out to use these defaults.
[linkedin]
max_requests_per_run = 120
pause_seconds = [20, 30]
